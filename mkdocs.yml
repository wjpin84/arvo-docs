site_name: Arvo
site_description: Arvo — Financial Intelligence Platform. Research, code and trading in one window, with an engine that keeps running when the window closes.
site_url: https://wjpin84.github.io/arvo-docs/
repo_url: https://github.com/wjpin84/arvo-docs
edit_uri: edit/main/docs/
copyright: Apache-2.0. Arvo links NautilusTrader (LGPL-3.0-only) into the engine.

theme:
  name: material
  logo: assets/arvo-mark.svg
  favicon: assets/arvo-mark.svg
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark
  font:
    text: Inter
    code: JetBrains Mono
  features:
    # No top tab bar: one sidebar, like Zed's docs. A second row of chrome
    # costs vertical space and makes a docs site look like a brochure.
    - navigation.sections
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.prune
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/wjpin84
      name: Arvo on GitHub

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.keys
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      # Appended to every page, so any jargon term gets a tooltip wherever it
      # appears. Progressive disclosure without editing prose: a reader who
      # knows "deflation" reads past it, and one who does not hovers it.
      base_path: ["."]
      auto_append:
        - includes/abbreviations.md
  - pymdownx.smartsymbols
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.blocks.caption
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - footnotes
  - def_list
  - abbr

